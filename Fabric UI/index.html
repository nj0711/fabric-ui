<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Fabric UI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Fredoka:wght@500;600;700&family=IBM+Plex+Mono:wght@500&family=Nunito+Sans:opsz,wght@6..12,500;6..12,600;6..12,700;6..12,800&display=swap">
<style>
/* Layout: a self-healing cutting mat as the worktable; the phone sits left, the studio panel right (stacked on phones). */
:root {
  --page-bg: #c8d2c2; --mat-line: rgba(38, 64, 44, .13); --mat-major: rgba(38, 64, 44, .25);
  --page-panel: #f7f6f2; --page-panel-2: #eeede6; --page-fg: #1f2420; --page-muted: #586159; --page-line: #d5d8cf;
  --page-accent: #2c4a7a; --page-on-accent: #ffffff; --page-err: #a3352b; --bed: #e3e0d8;
  --font-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Nunito Sans', 'Segoe UI', system-ui, sans-serif;
  --font-thread: 'Fredoka', 'Nunito Sans', 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  --label: var(--page-fg);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page-bg: #16221b; --mat-line: rgba(170, 210, 180, .065); --mat-major: rgba(170, 210, 180, .13);
    --page-panel: #1b201d; --page-panel-2: #232a25; --page-fg: #e7ebe5; --page-muted: #a1aba2; --page-line: #303934;
    --page-accent: #9fb8e6; --page-on-accent: #0f1f38; --page-err: #f19084; --bed: #2a302c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page-bg: #16221b; --mat-line: rgba(170, 210, 180, .065); --mat-major: rgba(170, 210, 180, .13);
  --page-panel: #1b201d; --page-panel-2: #232a25; --page-fg: #e7ebe5; --page-muted: #a1aba2; --page-line: #303934;
  --page-accent: #9fb8e6; --page-on-accent: #0f1f38; --page-err: #f19084; --bed: #2a302c; color-scheme: dark;
}
body {
  background-color: var(--page-bg); color: var(--page-fg); font-family: var(--font-body); font-size: 14px;
  background-image: linear-gradient(var(--mat-major) 1px, transparent 1px), linear-gradient(90deg, var(--mat-major) 1px, transparent 1px), linear-gradient(var(--mat-line) 1px, transparent 1px), linear-gradient(90deg, var(--mat-line) 1px, transparent 1px);
  background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px;
  overflow-x: hidden;
}
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
.sr-only { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; padding: 0; margin: -1px; }
:focus-visible { outline: 2px solid var(--page-accent); outline-offset: 2px; border-radius: 8px; }

/* ---------- page frame ---------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-block: 18px 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1180px; margin: 0 auto; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand h1 { font-family: var(--font-display); font-weight: 800; font-size: 26px; letter-spacing: -.01em; margin: 0; line-height: 1.05; }
.brand p { margin: 2px 0 0; color: var(--page-muted); font-size: 13px; }
.brand-mark { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: var(--page-panel); border: 1px solid var(--page-line); }
.layout { display: grid; grid-template-columns: minmax(360px, 430px) minmax(0, 660px); gap: 32px; justify-content: center; align-items: start; max-width: 1180px; margin: 0 auto; padding-block: 6px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.phone-col { position: sticky; top: calc(10px + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.phone-cap { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: var(--page-panel); border: 1px solid var(--page-line); border-radius: 14px; padding: 10px 14px; }
.phone-cap p { margin: 0; font-size: 12.5px; color: var(--page-muted); line-height: 1.45; flex: 1 1 220px; }
.phone-cap b { color: var(--page-fg); }
.app.narrow .layout { grid-template-columns: minmax(0, 1fr); gap: 16px; }
.app.narrow .phone-col { position: static; }
.app.studio-open .phone-col { position: sticky; top: 0; z-index: 30; padding-block: 6px; background: color-mix(in srgb, var(--page-bg) 88%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); margin-inline: -16px; padding-inline: 16px; }
.mobile-switch { width: 100%; }
.mobile-switch .seg { width: 100%; }
.mobile-switch .seg button { flex: 1; }

/* ---------- phone ---------- */
.stage { position: relative; width: 100%; }
.device { position: absolute; left: 50%; top: 0; width: 380px; height: 800px; margin-left: -190px; transform-origin: top center; padding: 10px; border-radius: 52px; background: linear-gradient(145deg, #2c2d30, #151618); box-shadow: 0 1px 0 rgba(255, 255, 255, .12) inset, 0 0 0 1.5px #0b0b0c, 0 30px 60px -20px rgba(0, 0, 0, .55), 0 12px 24px -10px rgba(0, 0, 0, .4); }
.screen { position: relative; width: 360px; height: 780px; border-radius: 42px; overflow: hidden; background: #6b6f73; font-family: var(--font-body); color: var(--ink); -webkit-user-select: none; user-select: none; }
.wall { position: absolute; inset: 0; background-size: cover; background-position: center; transition: background-image .3s; }
.wall-tint { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(rgba(0, 0, 0, .22), rgba(0, 0, 0, 0) 70px); }
.screen[data-mode="dark"] .wall-tint { background: linear-gradient(rgba(0, 0, 0, .45), rgba(0, 0, 0, .28) 120px, rgba(0, 0, 0, .3)); }
.statusbar { position: absolute; top: 0; left: 0; right: 0; height: 34px; padding: 6px 24px 0; display: flex; align-items: center; justify-content: space-between; color: #fff; font-weight: 700; font-size: 13px; text-shadow: 0 1px 2px rgba(0, 0, 0, .45); z-index: 6; font-variant-numeric: tabular-nums; }
.sb-right { display: flex; align-items: center; gap: 6px; filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .4)); }
.sb-bat { display: inline-block; width: 22px; height: 11px; border: 1.5px solid currentColor; border-radius: 3px; padding: 1px; }
.sb-bat span { display: block; height: 100%; background: currentColor; border-radius: 1px; }
.sb-pct { font-size: 12px; }
.pager { position: absolute; top: 38px; left: 0; width: 360px; bottom: 122px; overflow: hidden; z-index: 2; touch-action: pan-y; }
.pager-track { display: flex; height: 100%; transition: transform .38s cubic-bezier(.3, .7, .2, 1); }
.page { width: 360px; flex: none; padding: 6px 12px 0; display: flex; flex-direction: column; gap: 12px; position: relative; }
.row { display: flex; gap: 10px; align-items: stretch; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); row-gap: 12px; justify-items: center; margin-top: 2px; }
.dots { position: absolute; bottom: 102px; left: 0; right: 0; display: flex; justify-content: center; gap: 4px; z-index: 3; }
.dot { background: none; border: 0; padding: 3px; cursor: pointer; line-height: 0; filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .3)); }
.dock { position: absolute; left: 12px; bottom: 18px; z-index: 3; }
.dock-row { display: flex; justify-content: space-around; align-items: center; width: 100%; padding: 0 8px; }
.navbar { position: absolute; bottom: 6px; left: 50%; width: 112px; margin-left: -56px; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, .75); z-index: 4; }
.love-confetti { position: absolute; inset: 0; pointer-events: none; z-index: 1; }

/* ---------- the patch engine (canvas-rendered) ---------- */
.patch { position: relative; flex: none; display: flex; align-items: center; justify-content: center; color: var(--ink); transition: transform .12s; }
.patch[data-ready="false"] { background: var(--fab); box-shadow: 0 2px 6px rgba(0, 0, 0, .22); }
.patch.recess[data-ready="false"] { box-shadow: inset 0 1px 3px rgba(0, 0, 0, .3); }
.patch.bare[data-ready="false"], .patch.shape-path[data-ready="false"] { background: transparent; box-shadow: none; }
.p-canvas { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 0; }
.p-content { position: relative; z-index: 1; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
.stitched { display: inline-block; }
.abs { position: absolute; inset: 0; }
.emb { font-family: var(--font-thread); color: var(--ink); filter: url(#f-emb-text); line-height: 1.05; display: inline-block; padding: 1px 2px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.emb-sm { filter: url(#f-emb-sm); }
.cutout { filter: drop-shadow(1px 2px 2px rgb(0 0 0 / calc(.35 * var(--d, 1)))); pointer-events: none; -webkit-user-drag: none; }
.glyph, .leaf, .app-logo { display: block; overflow: visible; }

/* ---------- widgets ---------- */
.widget { cursor: default; }
.wx-cloud { position: absolute; left: 86px; top: 17px; height: 37px; }
.wx-pill { position: absolute; left: 14px; bottom: 12px; }
.wx-bat { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); display: flex; }
.batbar { position: relative; display: inline-flex; align-items: center; flex: none; }
.batbar-fill { position: absolute; left: 3px; top: 3px; display: block; }
.batbar-cap { width: 4px; height: 40%; border-radius: 0 2px 2px 0; margin-left: 1px; box-shadow: inset 0 1px 1px rgba(0, 0, 0, .3); }
.love-wrap { position: relative; }
.love { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 11px; }
.love-heart { position: absolute; top: 5px; left: 50%; width: 80px; height: 72px; margin-left: -40px; transform-origin: 50% 60%; }
.love-on .love-heart { animation: beat 1.7s ease-in-out infinite; }
@keyframes beat { 0%, 100% { transform: scale(1); } 12% { transform: scale(1.08); } 24% { transform: scale(.98); } 36% { transform: scale(1.05); } 50% { transform: scale(1); } }
.cal-grid { position: absolute; display: grid; grid-template-columns: repeat(7, 1fr); font: 600 9px/1 var(--font-thread); color: var(--ink); text-align: center; text-shadow: 0 .7px .4px rgba(0, 0, 0, .28), 0 -.4px 0 rgba(255, 255, 255, .25); }
.cal-dow { color: var(--ink-soft); height: 12px; display: grid; place-items: center; }
.cal-d { position: relative; height: 12.6px; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.search-wrap { position: relative; z-index: 4; }
.search-row { display: flex; align-items: center; gap: 6px; width: 100%; padding: 0 12px 0 46px; }
.search-input { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; font: 500 15px var(--font-thread); color: var(--ink); padding: 6px 0; -webkit-user-select: text; user-select: text; }
.search-input::placeholder { color: var(--ink-soft); opacity: 1; }
.search-drop { position: absolute; top: 52px; left: 0; z-index: 5; }
.search-res { display: flex; gap: 6px; padding: 0 10px; width: 100%; justify-content: flex-start; }
.icon-btn { background: none; border: 0; padding: 2px; cursor: pointer; line-height: 0; border-radius: 50%; }
.strip-row { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 0 11px; }
.qtile { background: none; border: 0; padding: 0; cursor: pointer; border-radius: 16px; }
.qtile:active .patch, .app:active .patch, .fbutton:active .patch { transform: translateY(1px) scale(.97); }
.knot-dot { position: absolute; top: 8px; right: 8px; width: 10px; height: 10px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ff7a6b, #c0272e 58%, #7e1519); box-shadow: 0 1px 1.5px rgba(0, 0, 0, .45); }
.app { display: flex; flex-direction: column; align-items: center; gap: 5px; background: none; border: 0; padding: 0; cursor: pointer; border-radius: 16px; }
.app-label { font: 700 11.5px/1.2 var(--font-body); color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, .7), 0 0 6px rgba(0, 0, 0, .35); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.todo { display: flex; flex-direction: column; gap: 9px; padding: 44px 14px 10px 15px; }
.todo-row { display: flex; align-items: center; gap: 9px; background: none; border: 0; padding: 2px 0; cursor: pointer; text-align: left; font: 600 12.5px/1.2 var(--font-thread); color: var(--ink); border-radius: 8px; }
.todo-text { text-shadow: 0 .7px .4px rgba(0, 0, 0, .25), 0 -.4px 0 rgba(255, 255, 255, .25); }
.todo-row.done .todo-text { text-decoration: line-through; text-decoration-thickness: 1.6px; opacity: .6; }
.water-btn { background: none; border: 0; padding: 0; cursor: pointer; border-radius: 20px; }
.water-btn:active .patch { transform: translateY(1px) scale(.98); }
.contacts { display: flex; justify-content: space-around; align-items: center; width: 100%; padding: 0 14px; }
.contact { display: flex; flex-direction: column; align-items: center; gap: 5px; background: none; border: 0; padding: 0; cursor: pointer; border-radius: 12px; }
.contact-name { font: 700 11.5px var(--font-thread); color: var(--ink); }
.clock { padding: 14px 16px; display: flex; flex-direction: column; justify-content: center; gap: 6px; }
.clock-time { display: flex; align-items: flex-start; gap: 2px; }
.clock-ap { margin-top: 6px; }
.batw { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 7px; padding-top: 88px; }
.batw-note { font: 600 10px var(--font-body); color: var(--ink-soft); }
.music { display: flex; align-items: center; gap: 12px; padding: 0 12px 0 14px; }
.music-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; padding-top: 30px; }
.music-fill { position: absolute; left: 1px; top: 1px; display: block; }
.music-sub { font: 600 11px var(--font-body); color: var(--ink-soft); padding-left: 2px; }
.music-prog { display: block; }
.music-ctl { display: flex; align-items: center; gap: 2px; }
.shade { position: absolute; inset: 0; z-index: 20; background: rgba(12, 10, 8, .5); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); animation: fade .2s; }
.shade-list { padding: 44px 12px 0; display: flex; flex-direction: column; gap: 10px; }
.shade-head { display: flex; justify-content: space-between; align-items: center; color: #fff; font: 700 13px var(--font-body); padding: 0 4px; }
.shade-close { background: rgba(255, 255, 255, .16); border: 0; border-radius: 999px; padding: 5px 12px; color: #fff; font-weight: 700; font-size: 12px; cursor: pointer; }
.shade-row { display: flex; align-items: center; gap: 10px; padding: 0 14px 0 12px; }
.shade-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.shade-text span { font: 600 11.5px var(--font-body); color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.shade-when { font: 600 11px var(--font-body); color: var(--ink-soft); }
.shade-note { color: rgba(255, 255, 255, .85); font-size: 11.5px; line-height: 1.4; margin: 4px 6px; }
.toast { position: absolute; left: 0; right: 0; bottom: 128px; display: flex; justify-content: center; z-index: 15; animation: rise .25s; pointer-events: none; }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }

/* ---------- fabric controls ---------- */
.fswitch { position: relative; background: none; border: 0; padding: 0; cursor: pointer; flex: none; border-radius: 999px; }
.fswitch .fswitch-text { position: absolute; left: 9px; top: 50%; transform: translateY(-52%); transition: left .2s; }
.fswitch:not(.on) .fswitch-text { left: auto; right: 8px; }
.fswitch-knob { position: absolute; top: 3px; left: 3px; transition: transform .22s cubic-bezier(.3, .7, .2, 1); }
.fswitch.on .fswitch-knob { transform: translateX(calc(var(--sw, 0px))); }
.fslider { position: relative; height: 28px; display: flex; align-items: center; cursor: pointer; touch-action: none; flex: none; border-radius: 999px; }
.fslider-fill { position: absolute; left: 2px; top: 10px; pointer-events: none; }
.fslider-knob { position: absolute; top: 2px; margin-left: -12px; pointer-events: none; }
.fcheck { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.fcheck-label { font: 600 13px var(--font-body); color: var(--label); }
.fcheck input:focus-visible + .patch { outline: 2px solid var(--page-accent); outline-offset: 2px; }
.knot { display: block; width: 9px; height: 9px; border-radius: 50%; box-shadow: inset -1px -1px 2px rgba(0, 0, 0, .35), inset 1px 1px 1px rgba(255, 255, 255, .3), 0 1px 1px rgba(0, 0, 0, .3); }
.fbutton { background: none; border: 0; padding: 0; cursor: pointer; border-radius: 999px; }

/* ---------- panel ---------- */
.panel { background: var(--page-panel); border: 1px solid var(--page-line); border-radius: 20px; min-width: 0; box-shadow: 0 18px 40px -26px rgba(0, 0, 0, .45); }
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; display: flex; gap: 4px; padding: 10px; background: var(--page-panel); border-bottom: 1px solid var(--page-line); border-radius: 20px 20px 0 0; overflow-x: auto; scrollbar-width: none; }
.tabs button { flex: none; background: none; border: 0; padding: 8px 14px; border-radius: 999px; font-weight: 700; font-size: 13.5px; color: var(--page-muted); cursor: pointer; }
.tabs button.on { background: var(--page-fg); color: var(--page-panel); }
.panel-body { color: var(--page-fg); }
.sec { padding: 18px 20px; border-top: 1px solid var(--page-line); display: flex; flex-direction: column; gap: 12px; }
.sec:first-child { border-top: 0; }
.sec-head h3 { font-family: var(--font-display); font-size: 16px; font-weight: 700; margin: 0; letter-spacing: -.005em; }
.sec-hint { margin: 3px 0 0; color: var(--page-muted); font-size: 12.5px; line-height: 1.45; max-width: 62ch; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; border-radius: 999px; background: var(--page-panel-2); border: 1px solid var(--page-line); }
.seg button { background: none; border: 0; padding: 7px 14px; border-radius: 999px; font-weight: 700; font-size: 13px; color: var(--page-muted); cursor: pointer; }
.seg button.on { background: var(--page-accent); color: var(--page-on-accent); }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; }
.swatch { background: none; border: 2px solid transparent; border-radius: 50%; padding: 2px; cursor: pointer; line-height: 0; }
.swatch.sel { border-color: var(--page-fg); }
.bobbins { gap: 4px; }
.bobbin { display: flex; flex-direction: column; align-items: center; gap: 1px; background: none; border: 2px solid transparent; border-radius: 10px; padding: 3px 3px 2px; cursor: pointer; }
.bobbin.sel { border-color: var(--page-fg); }
.bobbin-code { font: 500 9.5px var(--font-mono); color: var(--page-muted); }
.ideas { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.ideas-label, .inline-label { font-size: 12px; font-weight: 700; color: var(--page-muted); }
.ideas-label { width: 100%; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--page-line); border-radius: 999px; padding: 4px 10px; font-size: 12.5px; font-weight: 600; background: var(--page-panel); color: var(--page-fg); }
.chip code { font: 500 11px var(--font-mono); color: var(--page-muted); }
.chip-btn { cursor: pointer; }
.chip-btn.sel { border-color: var(--page-accent); box-shadow: 0 0 0 1px var(--page-accent) inset; }
.chip-dot { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .18); flex: none; }
.colorfield { display: flex; align-items: center; gap: 8px; }
.cf-pick { position: relative; width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--page-line); cursor: pointer; overflow: hidden; flex: none; }
.cf-pick input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
.cf-hex, .text-in { font: 500 13px var(--font-mono); width: 110px; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--page-line); background: var(--page-panel); color: var(--page-fg); }
.text-in { font-family: var(--font-body); width: 200px; max-width: 100%; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; }
.card { display: flex; flex-direction: column; gap: 3px; text-align: left; background: var(--page-panel-2); border: 1px solid var(--page-line); border-radius: 14px; padding: 8px 8px 10px; cursor: pointer; min-width: 0; }
.card.sel { border-color: var(--page-accent); box-shadow: 0 0 0 1px var(--page-accent) inset; }
.card-swatch { height: 66px; border-radius: 10px; background: var(--bed); display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 4px; }
.card-title { font-weight: 800; font-size: 13px; padding: 0 2px; }
.card-note { font-size: 11.5px; color: var(--page-muted); padding: 0 2px; }
.walls { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; }
.wall-thumb { position: relative; aspect-ratio: 9 / 15; max-width: 100%; border-radius: 12px; overflow: hidden; border: 2px solid transparent; padding: 0; cursor: pointer; background: var(--bed); }
.wall-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.wall-thumb.sel { border-color: var(--page-accent); }
